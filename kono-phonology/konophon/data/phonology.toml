####################################################################
# 音節構造 (phonology.tex 「音節構造」)
####################################################################

[syllable]
onset_max = 2
nucleus_min = 1
nucleus_max = 2
coda_max = 2

# オンセットの2子音結合表: 行=omega_0, 列=omega_1（自然類の略号で書く）
[syllable.onset_pairs]
S = ["T", "N", "L", "J"]
T = ["L", "J"]
N = ["L", "J"]
L = ["J"]

# コーダの2子音結合表: 行=kappa_0, 列=kappa_1
[syllable.coda_pairs]
S = ["T"]
T = ["T"]
N = ["S", "T"]
L = ["T", "N"]

# 核の2母音結合表: 行=nu_1, 列=nu_2（音素の綴りで書く）
[syllable.nucleus_pairs]
a = ["a", "e", "i", "y", "u", "v"]
o = ["a", "o", "e", "i", "y", "u", "v"]
e = ["a", "e", "i", "y"]
i = ["i"]
y = ["y"]
u = ["i", "y", "u"]
v = ["v"]

####################################################################
# 韻律 (phonology.tex 「音節の軽重」)
#
# rime スケール: 従来のモーラ．オンセットは寄与しない．
# prominence スケール: アクセント位置決定用．オンセットの複雑さを含む．
#   → 2機構モデル．pakata(HHH) vs paklata(LFL) の対立、および
#     kwilwa(FR, 軽音節にF) の説明を意図した仮説．検証対象であり確定事項ではない．
####################################################################

[prosody]
default_weight_scale = "rime"
fall_requires_mora = 2      # F (音節内下降) の実現に必要なライムのモーラ数

[prosody.scales.rime]
doc = "phonology.tex 準拠．ライムのみ．短核=1, 長核/二重母音=2, コーダ子音=各1"
nucleus_short = 1
nucleus_long = 2
per_coda_consonant = 1
per_extra_onset_consonant = 0

[prosody.scales.onset_sensitive]
doc = "オンセット第2子音以降を +1 する仮説的スケール (Ryan 2014 型)"
license_with_onset = true
nucleus_short = 1
nucleus_long = 2
per_coda_consonant = 1
per_extra_onset_consonant = 1

[prosody.weight_classes]
# モーラ数 -> 名前
1 = "light"
2 = "heavy"
3 = "superheavy"

[prosody.accent]
symbols = ["H", "L", "F", "R"]
H = { doc = "高", contour = false }
L = { doc = "低", contour = false }
F = { doc = "下降", contour = true, requires_mora = 2 }
R = { doc = "上昇", contour = true, requires_mora = 2 }

####################################################################
# 音韻規則（書き換え）
#   phonology.tex 「音素目録」remark の口蓋化，および
#   「綴り字と発音の乖離」．
#   DSL 記法: "A -> B / C _ D"（C, D は省略可，# は語境界）
####################################################################

[[rules]]
name = "palatalization_j"
doc = "x in {s,ts,z,h} について xj -> x^rho"
type = "spelling"
map = { "sj" = "c", "tsj" = "tc", "zj" = "zc", "hj" = "kh" }

[[rules]]
name = "palatalization_i"
doc = "x in {s,ts,z,h} について xi -> x^rho i"
type = "spelling"
map = { "si" = "ci", "tsi" = "tci", "zi" = "zci", "hi" = "khi" }

[[rules]]
name = "ji_absorption"
doc = "ji -> i"
type = "spelling"
map = { "ji" = "i" }

####################################################################
# 音声実現（綴り -> IPA）
####################################################################

[phonetics]
# そのまま発音される母音連続（明示しておく：不足分の検出用）
transparent_vowel_pairs = ["ai","ay","au","oi","ou","ei","ey","ui","uy"]

# 融合して長母音になる母音連続
[phonetics.vowel_fusion]
ae = "æː"
ea = "æː"
oe = "œː"
oy = "øː"
av = "ɔː"
ov = "oː"
aa = "aː"
oo = "oː"
ee = "eː"
ii = "iː"
yy = "yː"
uu = "ɘː"
vv = "uː"


[[phonetics.processes]]
name = "final_plosive_glottalization"
doc = "語末の（単独の）破裂音は [ʔ] で発音される"
rule = "[T] -> ʔ / [+syl] _ #"

[[phonetics.processes]]
name = "final_nasal_plosive_reduction"
doc = "語末の鼻音+破裂音の連続は鼻音も脱落し [ʔ] になる（要検討）"
rule = "[N][T] -> ʔ / _ #"
status = "tentative"

[[phonetics.processes]]
name = "medial_cluster_reduction"
doc = "3子音連続で中央の子音が脱落する場合がある"
rule = "[C] -> ∅ / [C] _ [C]"
status = "optional"

####################################################################
# 音素配列制約（既知のもの）
#   DSL: * を先頭に置くと markedness（禁止）制約．
#   weight は MaxEnt の初期重み（学習で更新される）．inf は絶対禁止（hard）．
####################################################################

[[constraints]]
name = "MAX-CLUSTER-3"
pattern = "*[C][C][C][C]"
doc = "単語内の子音列の長さは3以下"
weight = "inf"

[[constraints]]
name = "NO-DOUBLE-Q-ONSET"
pattern = "*[Q][C]"
doc = "破擦音は複雑オンセットの第1要素になれない（オンセット表の Q 行が空）"
weight = "inf"
scope = "onset"

[[constraints]]
name = "FINAL-SJV-AE"
pattern = "*([S]|[J])[+syl,-low,+high]#"
doc = "語末の音素列 x in (S∪J)V があれば x2 in {a,e}（tex「その他の制約2」）"
weight = 4.0
status = "statistical"

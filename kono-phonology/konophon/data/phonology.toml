####################################################################
# コノメノ音韻論 — 単一の真実 (single source of truth)
#
# このファイルが音素目録・素性・IPA・音韻制約の唯一の定義元である．
# detail/chapters/p-side/phonology.tex の表はここから生成する
# (scripts/gen_tex_tables.py)．コード側にハードコードしないこと．
#
# 参照: phonology.tex 「音素目録」「音節構造」「音韻制約」
####################################################################

[meta]
name = "konomeno"
version = "5"
source = "detail/chapters/p-side/phonology.tex"

####################################################################
# 素性の宣言
#   type = "binary"  -> DSL で [+cons] / [-cons]
#   type = "privative" -> [+lat] のみ（-は「その素性を持たない」）
#   type = "scalar"  -> [son=7] / [son>=6]
#   type = "categorical" -> [place=labial]
####################################################################

[features]
syl    = { type = "binary",      doc = "音節主音性 (母音=+)" }
cons   = { type = "binary",      doc = "子音性" }
son    = { type = "binary",      doc = "共鳴性 (鼻音・流音・接近音・母音=+)" }
voi    = { type = "binary",      doc = "有声性" }
cont   = { type = "binary",      doc = "継続性 (摩擦音・接近音・母音=+)" }
nas    = { type = "binary",      doc = "鼻音性" }
lat    = { type = "binary",      doc = "側面性" }
place  = { type = "categorical", doc = "調音位置", values = ["labial","alveolar","postalveolar","palatal","velar","glottal"] }
manner = { type = "categorical", doc = "調音法",   values = ["fricative","affricate","plosive","nasal","liquid","approximant","vowel"] }
# 母音素性
high   = { type = "binary",      doc = "狭" }
low    = { type = "binary",      doc = "広" }
back   = { type = "binary",      doc = "後舌" }
round  = { type = "binary",      doc = "円唇" }
central= { type = "binary",      doc = "中舌" }
sonor  = { type = "scalar",      doc = "ソノリティ階層 (大きいほど共鳴的)" }

####################################################################
# 自然類の略号
#   phonology.tex 「音節構造」の記法 C, V, S, Q, T, N, L, J に対応．
#   DSL 中で [S] のように 1 文字で書ける．
####################################################################

[classes]
C = "[+cons]"
V = "[+syl]"
S = "[manner=fricative]"
Q = "[manner=affricate]"
T = "[manner=plosive]"
N = "[manner=nasal]"
L = "[manner=liquid]"
J = "[manner=approximant]"
O = "[-son,+cons]"          # 阻害音 (obstruent)
R = "[+son,+cons]"          # 共鳴子音 (sonorant consonant)

####################################################################
